<!doctype html>
<meta charset="utf-8" />
<title>Screen Solver</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0a0c10; color: #e7ebf2;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-app-region: drag; user-select: none;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  #msg { color: #8b94a6; font-size: 12px; max-width: 460px; text-align: center; }
  #bar { width: 260px; height: 3px; border-radius: 2px; background: #1b212b; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 35%; border-radius: 2px; background: #7dd3fc;
           animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(360%);} }
  pre {
    -webkit-app-region: no-drag; user-select: text;
    max-width: 620px; max-height: 220px; overflow: auto; margin: 8px 0 0;
    padding: 10px 12px; border-radius: 8px; background: #0d1016; border: 1px solid #232a36;
    color: #7f8899; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }
  .err #bar { display: none; }
  .err #msg { color: #fca5a5; }
</style>
<h1>Screen Solver</h1>
<div id="bar"><i></i></div>
<div id="msg">Starting…</div>
<pre id="log" hidden></pre>
<script>
  const { ipcRenderer } = require("electron");
  const msg = document.getElementById("msg");
  const log = document.getElementById("log");
  ipcRenderer.on("status", (_e, text) => { msg.textContent = text; });
  ipcRenderer.on("log", (_e, line) => {
    log.hidden = false;
    log.textContent = (log.textContent + "\n" + line).slice(-4000);
    log.scrollTop = log.scrollHeight;
  });
  ipcRenderer.on("failed", (_e, text) => {
    document.body.classList.add("err");
    msg.textContent = text;
  });
</script>
